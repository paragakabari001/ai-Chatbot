<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dar Global & Wasalt | AI Real Estate Advisor</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            app: {
              bg: '#0A0A0A',
              card: '#161616',
              border: '#262626',
              input: '#1A1A1A',
              bubble: '#1F1F1F',
              accent: '#3B82F6',
              gold: '#D4AF37',
              emerald: '#10B981'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Dark Minimalist Theme */
    body {
      background-color: #0A0A0A;
      color: #E5E5E5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0A0A0A; }
    ::-webkit-scrollbar-thumb { background: #262626; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #333333; }

    /* Typing cursor effect */
    .typing-cursor::after {
      content: '▋';
      display: inline-block;
      vertical-align: middle;
      color: #FFFFFF;
      animation: blink 0.8s infinite;
      margin-left: 3px;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Markdown Styling */
    .prose-chat h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #FFFFFF;
      margin-top: 1.25rem;
      margin-bottom: 0.6rem;
      letter-spacing: -0.01em;
    }
    .prose-chat h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #FFFFFF;
      margin-top: 1.2rem;
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }
    .prose-chat h3 {
      font-size: 1rem;
      font-weight: 600;
      color: #FFFFFF;
      margin-top: 1rem;
      margin-bottom: 0.4rem;
    }
    .prose-chat h4 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #F3F4F6;
      margin-top: 0.85rem;
      margin-bottom: 0.35rem;
    }
    .prose-chat p {
      margin-bottom: 0.85rem;
      line-height: 1.65;
      color: #D4D4D4;
      font-size: 0.9375rem;
    }
    .prose-chat ul {
      list-style-type: disc;
      padding-left: 1.4rem;
      margin-bottom: 0.9rem;
      color: #D4D4D4;
    }
    .prose-chat ol {
      list-style-type: decimal;
      padding-left: 1.4rem;
      margin-bottom: 0.9rem;
      color: #D4D4D4;
    }
    .prose-chat li {
      margin-bottom: 0.35rem;
      line-height: 1.6;
      font-size: 0.9375rem;
    }
    .prose-chat strong {
      color: #FFFFFF;
      font-weight: 600;
    }
    .prose-chat a {
      color: #60A5FA;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .prose-chat code {
      background-color: #1A1A1A;
      color: #E5E5E5;
      padding: 0.15rem 0.35rem;
      border-radius: 0.25rem;
      font-size: 0.85em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>
<body class="bg-[#0A0A0A] text-[#E5E5E5] min-h-screen flex flex-col antialiased">
  <div id="root" class="flex-1 flex flex-col h-screen"></div>

  <!-- React 18 Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    marked.setOptions({
      breaks: true,
      gfm: true
    });

    function App() {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState("");
      const [isStreaming, setIsStreaming] = useState(false);
      const [model, setModel] = useState("openai/gpt-4o");
      const [showRecruiterModal, setShowRecruiterModal] = useState(false);
      const [showModelPicker, setShowModelPicker] = useState(false);
      const messagesEndRef = useRef(null);
      const chatInputRef = useRef(null);

      const quickPrompts = [
        "What are Dar Global's top luxury branded residential projects and international locations?",
        "How do I search, rent, or buy apartments and villas in Riyadh on Wasalt?",
        "Explain Dar Global's 7-day token reservation policy and purchase agreement terms.",
        "What are Saudi REGA regulations, Fal licensing, and the Ejar network on Wasalt?"
      ];

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages, isStreaming]);

      const handleSend = async (textToSend) => {
        const query = (textToSend || input).trim();
        if (!query || isStreaming) return;

        const userMessage = { role: "user", content: query };
        const assistantMessage = { role: "assistant", content: "", citations: [], id: Date.now() };

        setMessages((prev) => [...prev, userMessage, assistantMessage]);
        setInput("");
        setIsStreaming(true);

        if (chatInputRef.current) {
          chatInputRef.current.style.height = "auto";
        }

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: query, model: model, top_k: 4 }),
          });

          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const reader = response.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const blocks = buffer.split("\n\n");
            buffer = blocks.pop() || "";

            for (const block of blocks) {
              if (!block.trim()) continue;
              const lines = block.split("\n");
              let eventType = "message";
              let dataStr = "";

              for (const line of lines) {
                if (line.startsWith("event: ")) eventType = line.slice(7).trim();
                else if (line.startsWith("data: ")) dataStr = line.slice(6).trim();
              }

              if (eventType === "citations") {
                try {
                  const parsedCitations = JSON.parse(dataStr);
                  setMessages((prev) => {
                    const next = [...prev];
                    const last = next[next.length - 1];
                    if (last && last.role === "assistant") {
                      last.citations = parsedCitations;
                    }
                    return next;
                  });
                } catch (e) {}
              } else if (eventType === "token") {
                let token = "";
                try {
                  token = JSON.parse(dataStr).token;
                } catch (e) {
                  token = dataStr;
                }
                setMessages((prev) => {
                  const next = [...prev];
                  const last = next[next.length - 1];
                  if (last && last.role === "assistant") {
                    last.content += token;
                  }
                  return next;
                });
              }
            }
          }
        } catch (err) {
          setMessages((prev) => {
            const next = [...prev];
            const last = next[next.length - 1];
            if (last && last.role === "assistant") {
              last.content = `Error: ${err.message}. Please retry.`;
            }
            return next;
          });
        } finally {
          setIsStreaming(false);
        }
      };

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text);
      };

      return (
        <div className="flex flex-col h-screen bg-[#0A0A0A] text-[#E5E5E5] font-sans">
          
          {/* Top Bar - Minimalist */}
          <header className="px-6 py-3.5 flex items-center justify-between border-b border-transparent z-20">
            {/* Left: Brand Badges */}
            <div className="flex items-center gap-2.5">
              <a href="https://darglobal.co.uk/" target="_blank" rel="noopener" className="flex items-center gap-1.5 text-xs text-neutral-300 hover:text-white transition">
                <span className="w-2 h-2 rounded-full bg-[#D4AF37] shadow-[0_0_6px_#D4AF37]"></span>
                <span className="font-semibold tracking-wide">DAR GLOBAL</span>
                <span className="text-[10px] text-neutral-500 font-normal">LSE: DAR</span>
              </a>
              <span className="text-neutral-700 text-xs">/</span>
              <a href="https://wasalt.sa/en" target="_blank" rel="noopener" className="flex items-center gap-1.5 text-xs text-neutral-300 hover:text-white transition">
                <span className="w-2 h-2 rounded-full bg-[#10B981] shadow-[0_0_6px_#10B981]"></span>
                <span className="font-semibold tracking-wide">WASALT</span>
                <span className="text-[10px] text-neutral-500 font-normal">REGA Certified</span>
              </a>
            </div>

            {/* Right: Status & Recruiter Task Pill */}
            <div className="flex items-center gap-3">
              <button
                onClick={() => setShowRecruiterModal(true)}
                className="flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#161616] border border-neutral-800 hover:border-neutral-700 text-xs text-neutral-300 hover:text-white transition"
              >
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                <span>Recruiter Tasks</span>
              </button>

              <div className="flex items-center gap-2 text-xs text-neutral-400">
                <span className="w-2 h-2 rounded-full bg-white/20"></span>
                <span>Enterprise AI Advisor</span>
              </div>
            </div>
          </header>

          {/* Main Conversational Canvas */}
          <main className="flex-1 flex flex-col max-w-3xl w-full mx-auto px-4 overflow-hidden relative">
            
            {messages.length === 0 ? (
              /* Minimalist Empty State: "What should we explore?" */
              <div className="flex-1 flex flex-col items-center justify-center text-center pb-24">
                <h1 className="text-3xl sm:text-4xl font-bold text-white mb-8 tracking-tight">
                  What should we explore?
                </h1>

                {/* Center Input Capsule */}
                <div className="w-full max-w-2xl bg-[#161616] border border-[#262626] rounded-3xl p-4 shadow-2xl focus-within:border-neutral-600 transition-all text-left">
                  <textarea
                    ref={chatInputRef}
                    rows="2"
                    value={input}
                    onChange={(e) => {
                      setInput(e.target.value);
                      e.target.style.height = "auto";
                      e.target.style.height = Math.min(e.target.scrollHeight, 140) + "px";
                    }}
                    onKeyDown={(e) => {
                      if (e.key === "Enter" && !e.shiftKey) {
                        e.preventDefault();
                        handleSend();
                      }
                    }}
                    placeholder="Ask anything about Dar Global luxury developments or Wasalt properties..."
                    className="w-full bg-transparent text-white placeholder-neutral-500 text-sm outline-none resize-none"
                  />

                  <div className="flex items-center justify-between mt-3 pt-2 border-t border-[#222222]">
                    <div className="flex items-center gap-2">
                      <button className="w-7 h-7 rounded-full bg-neutral-800 hover:bg-neutral-700 text-neutral-400 hover:text-white flex items-center justify-center text-base transition">
                        +
                      </button>
                    </div>

                    <div className="flex items-center gap-3">
                      {/* Model Selector Pill */}
                      <div className="relative">
                        <button
                          onClick={() => setShowModelPicker(!showModelPicker)}
                          className="flex items-center gap-1.5 px-3 py-1 rounded-full bg-neutral-800/80 hover:bg-neutral-700 text-xs text-neutral-300 font-medium transition"
                        >
                          <span>{model === "openai/gpt-4o" ? "GPT-4o (Active)" : "Free Model"}</span>
                          <span className="text-[10px] text-neutral-500">⌵</span>
                        </button>

                        {showModelPicker && (
                          <div className="absolute right-0 bottom-8 bg-[#1A1A1A] border border-neutral-700 rounded-xl p-1 shadow-2xl z-30 w-44 text-xs">
                            <button
                              onClick={() => { setModel("openai/gpt-4o"); setShowModelPicker(false); }}
                              className="w-full text-left px-3 py-2 rounded-lg hover:bg-neutral-800 text-white font-medium"
                            >
                              OpenAI GPT-4o
                            </button>
                            <button
                              onClick={() => { setModel("google/gemini-2.0-flash-exp:free"); setShowModelPicker(false); }}
                              className="w-full text-left px-3 py-2 rounded-lg hover:bg-neutral-800 text-neutral-300"
                            >
                              Gemini 2.0 Flash
                            </button>
                            <button
                              onClick={() => { setModel("meta-llama/llama-3.3-70b-instruct:free"); setShowModelPicker(false); }}
                              className="w-full text-left px-3 py-2 rounded-lg hover:bg-neutral-800 text-neutral-300"
                            >
                              Llama 3.3 70B
                            </button>
                          </div>
                        )}
                      </div>

                      {/* Mic icon */}
                      <button className="text-neutral-400 hover:text-white transition">
                        <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        </svg>
                      </button>

                      {/* Send button */}
                      <button
                        onClick={() => handleSend()}
                        disabled={isStreaming || !input.trim()}
                        className="w-8 h-8 rounded-full bg-white hover:bg-neutral-200 text-black flex items-center justify-center font-bold transition disabled:opacity-30 disabled:cursor-not-allowed"
                      >
                        <svg className="w-4 h-4 transform rotate-90" fill="currentColor" viewBox="0 0 20 20">
                          <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path>
                        </svg>
                      </button>
                    </div>
                  </div>
                </div>

                {/* Subtle Suggestion Chips */}
                <div className="flex flex-wrap gap-2 mt-6 max-w-2xl justify-center">
                  {quickPrompts.map((p, idx) => (
                    <button
                      key={idx}
                      onClick={() => handleSend(p)}
                      className="text-xs text-neutral-400 hover:text-white bg-[#141414] hover:bg-[#1C1C1C] border border-[#222222] px-3.5 py-1.5 rounded-full transition"
                    >
                      {p.length > 45 ? p.slice(0, 45) + "..." : p}
                    </button>
                  ))}
                </div>
              </div>
            ) : (
              /* Active Conversational Feed */
              <div className="flex-1 overflow-y-auto space-y-6 pt-4 pb-32 pr-2">
                {messages.map((m, idx) => (
                  <div key={idx} className={`w-full flex ${m.role === "user" ? "justify-end" : "justify-start"}`}>
                    {m.role === "user" ? (
                      /* User message: Small rounded dark pill on right */
                      <div className="max-w-[85%] sm:max-w-xl bg-[#1C1C1C] border border-neutral-800 text-white px-4 py-2.5 rounded-2xl text-sm leading-relaxed">
                        {m.content}
                      </div>
                    ) : (
                      /* Assistant message: Borderless, rendered directly on canvas with rich markdown */
                      <div className="w-full text-neutral-200">
                        <div
                          className={`prose-chat ${isStreaming && idx === messages.length - 1 ? "typing-cursor" : ""}`}
                          dangerouslySetInnerHTML={{ __html: marked.parse(m.content || "Thinking...") }}
                        />

                        {/* Interactive Entity Highlight Cards */}
                        {m.content && <EntityCards text={m.content} />}

                        {/* Source Citations */}
                        {m.citations && m.citations.length > 0 && (
                          <div className="mt-4 pt-3 border-t border-[#1C1C1C]">
                            <div className="text-[11px] font-semibold text-neutral-500 uppercase tracking-wider mb-2">
                              Sources & Knowledge Grounding
                            </div>
                            <div className="flex flex-wrap gap-2">
                              {m.citations.map((c, cIdx) => (
                                <a
                                  key={cIdx}
                                  href={c.url}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#141414] border border-[#222222] hover:border-neutral-600 text-xs text-neutral-300 hover:text-white transition"
                                >
                                  <span className={`w-1.5 h-1.5 rounded-full ${c.source === 'Dar Global' ? 'bg-[#D4AF37]' : 'bg-[#10B981]'}`}></span>
                                  <span className="font-semibold text-white">{c.source}:</span>
                                  <span className="truncate max-w-[160px] text-neutral-400">{c.title}</span>
                                </a>
                              ))}
                            </div>
                          </div>
                        )}

                        {/* Action buttons (Copy) */}
                        {m.content && (
                          <div className="mt-3 flex items-center justify-between text-xs text-neutral-500">
                            <span>Answered by OpenAI GPT-4o • Grounded on Dar Global & Wasalt</span>
                            <button
                              onClick={() => copyToClipboard(m.content)}
                              className="text-neutral-400 hover:text-white transition flex items-center gap-1"
                            >
                              <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                              </svg>
                              <span>Copy</span>
                            </button>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                ))}
                <div ref={messagesEndRef} />
              </div>
            )}

            {/* Floating Bottom Input Capsule (When in chat conversation) */}
            {messages.length > 0 && (
              <div className="absolute bottom-4 left-0 right-0 px-4">
                <div className="max-w-3xl mx-auto bg-[#161616] border border-[#262626] rounded-3xl p-3.5 shadow-2xl focus-within:border-neutral-600 transition-all">
                  <textarea
                    ref={chatInputRef}
                    rows="1"
                    value={input}
                    onChange={(e) => {
                      setInput(e.target.value);
                      e.target.style.height = "auto";
                      e.target.style.height = Math.min(e.target.scrollHeight, 120) + "px";
                    }}
                    onKeyDown={(e) => {
                      if (e.key === "Enter" && !e.shiftKey) {
                        e.preventDefault();
                        handleSend();
                      }
                    }}
                    placeholder="Ask anything about Dar Global or Wasalt..."
                    className="w-full bg-transparent text-white placeholder-neutral-500 text-sm outline-none resize-none max-h-28"
                  />

                  <div className="flex items-center justify-between mt-2 pt-2 border-t border-[#222222]">
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setMessages([])}
                        className="text-xs text-neutral-500 hover:text-neutral-300 px-2 py-0.5 rounded transition"
                        title="Clear Conversation"
                      >
                        Clear
                      </button>
                    </div>

                    <div className="flex items-center gap-3">
                      <button
                        onClick={() => setShowModelPicker(!showModelPicker)}
                        className="flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-neutral-800 text-xs text-neutral-300 font-medium"
                      >
                        <span>{model === "openai/gpt-4o" ? "GPT-4o" : "Free"}</span>
                        <span className="text-[10px] text-neutral-500">⌵</span>
                      </button>

                      <button
                        onClick={() => handleSend()}
                        disabled={isStreaming || !input.trim()}
                        className="w-7 h-7 rounded-full bg-white hover:bg-neutral-200 text-black flex items-center justify-center font-bold transition disabled:opacity-30 disabled:cursor-not-allowed"
                      >
                        <svg className="w-3.5 h-3.5 transform rotate-90" fill="currentColor" viewBox="0 0 20 20">
                          <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path>
                        </svg>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Recruiter Evaluation Modal */}
          {showRecruiterModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-[#141414] border border-[#262626] rounded-2xl max-w-lg w-full p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-neutral-800">
                  <div>
                    <h3 className="text-sm font-bold text-white flex items-center gap-2">
                      <span>📋</span> AI Full-Stack Assignment Verification
                    </h3>
                    <p className="text-xs text-neutral-400">Candidate: <strong className="text-white">PARAG AKABARI</strong></p>
                  </div>
                  <button onClick={() => setShowRecruiterModal(false)} className="text-neutral-400 hover:text-white text-xl font-bold">&times;</button>
                </div>

                <div className="mt-4 space-y-2.5 text-xs text-neutral-300">
                  <div className="p-3 rounded-xl bg-[#1A1A1A] border border-neutral-800">
                    <strong className="text-emerald-400">1. Data Collection & Ethics:</strong> 59 grounded records from Dar Global & Wasalt, strictly respecting Wasalt's robots.txt access rules (avoiding /search).
                  </div>
                  <div className="p-3 rounded-xl bg-[#1A1A1A] border border-neutral-800">
                    <strong className="text-emerald-400">2. Grounded Chatbot:</strong> BM25 lexical ranking engine + strict zero-hallucination prompt boundaries.
                  </div>
                  <div className="p-3 rounded-xl bg-[#1A1A1A] border border-neutral-800">
                    <strong className="text-emerald-400">3. OpenRouter Free & GPT-4o:</strong> Token streaming with user key and deterministic fallback.
                  </div>
                  <div className="p-3 rounded-xl bg-[#1A1A1A] border border-neutral-800">
                    <strong className="text-emerald-400">4. Docker Container:</strong> Multi-stage build running non-root appuser on port 8000.
                  </div>
                  <div className="p-3 rounded-xl bg-[#1A1A1A] border border-neutral-800">
                    <strong className="text-emerald-400">5. Live Deployment:</strong> Verified HTTPS URL for direct evaluation.
                  </div>
                </div>

                <div className="mt-5 flex justify-end">
                  <button
                    onClick={() => setShowRecruiterModal(false)}
                    className="px-4 py-1.5 rounded-lg bg-white text-black font-semibold text-xs hover:bg-neutral-200 transition"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function EntityCards({ text }) {
      const lower = text.toLowerCase();
      const cards = [];

      if (lower.includes("davinci") || lower.includes("pagani")) {
        cards.push({
          title: "DaVinci Tower by Pagani",
          partner: "Pagani Automobili",
          loc: "Downtown Dubai Canal",
          desc: "Ultra-luxury residential landmark with carbon-fiber architecture and Burj Khalifa views.",
          url: "https://darglobal.co.uk/projects"
        });
      }

      if (lower.includes("aida") || lower.includes("muscat")) {
        cards.push({
          title: "AIDA Muscat Community",
          partner: "Trump International Golf",
          loc: "Muscat, Oman (130m Cliffside)",
          desc: "Freehold luxury cliffside villas, Trump Golf Club & permanent residency in Oman.",
          url: "https://darglobal.co.uk/projects"
        });
      }

      if (lower.includes("urban oasis") || lower.includes("missoni")) {
        cards.push({
          title: "Urban Oasis by Missoni",
          partner: "Missoni Italian Fashion",
          loc: "Dubai Canal, Business Bay",
          desc: "Signature Missoni zig-zag geometries, waterfront infinity pool & aquatic gym.",
          url: "https://darglobal.co.uk/projects"
        });
      }

      if (lower.includes("wasalt") || lower.includes("riyadh") || lower.includes("rega") || lower.includes("ejar")) {
        cards.push({
          title: "Wasalt Saudi Real Estate",
          partner: "REGA & Fal Licensed",
          loc: "Kingdom of Saudi Arabia (Riyadh/Jeddah)",
          desc: "Verified properties for rent & sale, 360-degree tours & electronic Ejar contracts.",
          url: "https://wasalt.sa/en"
        });
      }

      if (cards.length === 0) return null;

      return (
        <div className="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-2">
          {cards.slice(0, 2).map((c, idx) => (
            <div key={idx} className="p-3 rounded-xl bg-[#141414] border border-[#262626] text-xs">
              <div className="flex items-center justify-between font-bold text-white mb-1">
                <span>{c.title}</span>
                <span className="text-[10px] px-2 py-0.5 bg-neutral-800 text-neutral-300 rounded font-medium">{c.partner}</span>
              </div>
              <div className="text-neutral-500 text-[11px]">📍 {c.loc}</div>
              <div className="text-neutral-400 text-xs mt-1.5 leading-snug">{c.desc}</div>
            </div>
          ))}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
